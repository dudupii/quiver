    <text x="130" y="186" font-size="11" fill="#8b949e">次セッションにサマリー</text>

    <text x="390" y="338" font-size="11" fill="#8b949e">共有ディレクトリ 1 つ、どの agent でも——handover が書き、relay が点火、agent が作業、catchup が読み戻す</text>
